<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research App</title><link rel="stylesheet" href="/web/app.css"></head>
<body>
<header id="topic-header"><button id="back-to-topics" hidden>← Topics</button><div class="header-title"><strong id="topic-title">Topics</strong><small id="workspace"></small></div><span id="refresh-label"></span></header>
<div id="tab-bar" role="tablist"></div>
<div class="layout"><aside class="topics"><h1>Topics</h1><div id="topic-list"></div><form id="new-topic"><h2>New topic</h2><label>Title<input name="title" required></label><label>Focus<textarea name="focus" rows="3"></textarea></label><label>Backend<select name="backend"><option>claude</option><option>codex</option></select></label><button>Create and research</button></form></aside>
<main><section id="run-status" aria-live="polite"></section><div id="section-layout"><section id="content" class="document"></section><aside id="comment-margin"><button id="comment-button" title="Comment on selection" hidden>+</button><div id="draft-slot"></div><div id="thread-list"></div><div id="orphan-list"></div><div id="resolved-list"></div></aside></div><form id="instruct-form"><h2>Start a track</h2><label>Instruction<textarea name="instruction" placeholder="Add a section, check a claim, or build a chart" required></textarea></label><div class="row"><label>Backend<select name="backend"><option>claude</option><option>codex</option></select></label><button>Start</button></div></form></main></div>
<div id="toast" role="status"></div><script type="module" src="/web/app.js"></script></body></html>
