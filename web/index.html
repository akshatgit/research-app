<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research App</title><link rel="stylesheet" href="/web/app.css"></head>
<body><header><strong>Research App</strong><button id="back-to-topics" hidden>&larr; Topics</button><span id="topic-title">Topics</span><nav><button id="document-tab">Document</button><button id="assets-tab">Assets</button><button id="runs-tab">Runs</button></nav></header>
<div class="layout"><aside class="topics"><h2>Topics</h2><div id="topic-list"></div><form id="new-topic"><h3>New topic</h3><label>Title<input name="title" required></label><label>Focus<textarea name="focus" rows="3"></textarea></label><label>Backend<select name="backend"><option>claude</option><option>codex</option></select></label><button>Create and research</button></form></aside>
<main><form id="instruct-form"><label>Research instruction<textarea name="instruction" placeholder="Add a section, check a claim, or build a chart" required></textarea></label><div class="row"><label>Backend<select name="backend"><option>claude</option><option>codex</option></select></label><button>Run instruction</button></div></form><section id="run-status" aria-live="polite"></section><section id="content" class="document"></section></main>
<aside class="threads"><h2>Threads</h2><div id="thread-list"></div></aside></div>
<div id="selection-actions" hidden><button id="ask-button">Ask</button><button data-quick="What does this mean?">Explain</button><button data-quick="Is this true? Check against sources and the web.">Is this true?</button><button data-quick="Go deeper.">Go deeper</button><button data-quick="Give an example.">Example</button></div>
<dialog id="ask-dialog"><form id="ask-form"><h2>Ask about selection</h2><blockquote id="ask-quote"></blockquote><label>Question<textarea name="question">What does this mean?</textarea></label><label>Backend<select name="backend"><option>claude</option><option>codex</option></select></label><div class="row"><button type="button" id="ask-close">Cancel</button><button>Ask</button></div></form></dialog>
<div id="toast" role="status"></div><script type="module" src="/web/app.js"></script></body></html>
