<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research App</title><link rel="stylesheet" href="/web/app.css"></head>
<body>
<header id="topic-header"><button id="back-to-topics" hidden>← Topics</button><div class="header-title"><strong id="topic-title">Topics</strong><small id="workspace"></small></div><button id="comments-list" type="button" hidden>Comments</button><span id="refresh-label"></span></header>
<div id="tab-bar" role="tablist"></div>
<div class="layout"><aside class="topics"><h1>Topics</h1><div id="topic-list"></div><form id="new-topic"><h2>New topic</h2><label>What do you want to research?<textarea name="statement" rows="5" required></textarea></label><label>Title (optional)<input name="title"></label><label>Backend<select name="backend"><option>claude</option><option>codex</option></select></label><button>Create and research</button></form></aside>
<main><section id="run-status" aria-live="polite"></section><button id="show-comments" hidden></button><div id="section-layout"><section id="content" class="document"></section><aside id="comment-margin"><div class="margin-controls"><button id="collapse-all" type="button">Collapse all</button><button id="hide-comments" type="button">Hide comments</button></div><div id="draft-slot"></div><div id="thread-list"></div><div id="orphan-list"></div><div id="resolved-list"></div></aside></div><form id="instruct-form"><h2>Start a track</h2><label>Instruction<textarea name="instruction" placeholder="Add a section, check a claim, or build a chart" required></textarea></label><div class="row"><label>Backend<select name="backend"><option>claude</option><option>codex</option></select></label><button>Start</button></div></form></main></div>
<dialog id="thread-dialog" aria-label="Comment"><div class="dialog-head"><strong>Comment</strong><button id="dialog-close" type="button" aria-label="Close comment">✕</button></div><div id="dialog-quote"></div><div id="dialog-body"></div><div id="dialog-footer"></div></dialog>
<button id="comment-button" type="button" title="Comment on the selected text" hidden>Comment</button><div id="toast" role="status"></div><script type="module" src="/web/app.js"></script></body></html>
